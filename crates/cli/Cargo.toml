[package]
name = "claude-code-manager-cli"
version = "0.1.5"
edition = "2021"
description = "The `claude-code-manager` CLI: session surgery over Claude Code session files."
license = "MIT"
repository = "https://github.com/zillydev/claude-code-manager"

# The binary name is load-bearing: the session-surgery and session-harvest
# skills resolve `claude-code-manager` on PATH. Do not rename it without
# updating skills/*/SKILL.md.
[[bin]]
name = "claude-code-manager"
path = "src/main.rs"

[dependencies]
claude-code-manager-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
