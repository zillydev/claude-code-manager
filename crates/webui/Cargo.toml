[package]
name = "claude-manager-webui"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_manager_webui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-manager-webui"
path = "src/main.rs"

[dependencies]
claude-manager-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
portable-pty = "0.8"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
