<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>claude-manager</title>
    <!--
      In-session find highlights. Served raw here (not via the Tailwind/
      lightningcss pipeline) because lightningcss does not recognize the
      ::highlight() pseudo-element and may strip these rules. The CSS Custom
      Highlight API has no JS styling API, so the rule must reach the browser.
    -->
    <style>
      ::highlight(cm-find) {
        background-color: rgba(210, 153, 34, 0.3);
      }
      ::highlight(cm-find-active) {
        background-color: var(--color-system, #d29922);
        color: var(--color-bg, #0d1117);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
