<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code Manager</title>
    <!--
      In-session find highlights. Served raw here (not via the Tailwind/
      lightningcss pipeline) because lightningcss does not recognise the
      ::highlight() pseudo-element and strips the rules. Tint only — the text
      colour is left alone so matches stay readable in both themes (the
      global find's cards use the same 35% tint).
    -->
    <style>
      ::highlight(cm-find) {
        background-color: color-mix(in srgb, var(--color-system, #d29922) 35%, transparent);
      }
      ::highlight(cm-find-active) {
        background-color: color-mix(in srgb, var(--color-system, #d29922) 75%, transparent);
      }

      /*
        Custom scrollbars, app-wide. Styling ::-webkit-scrollbar opts WKWebView
        out of macOS overlay scrollbars, whose auto-hiding thumb made click-and-
        drag a chase. The transparent border + padding-box clip draws a slim
        thumb with a built-in hover gutter; the track's block margin keeps the
        thumb's travel clear of the window's rounded bottom corner, which was
        clipping the last few pixels. Raw here alongside the ::highlight rules
        (one place for engine-facing CSS the build pipeline must not touch).
      */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
        margin-block: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: color-mix(in srgb, var(--color-text-dim, #8b949e) 40%, transparent);
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 6px;
        min-height: 32px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--color-text-dim, #8b949e) 65%, transparent);
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: var(--color-text-dim, #8b949e);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      /* Scrollers that render a CustomScrollbar hide the native one entirely
         (the DOM thumb can't be stolen by the overlay painter on hover). */
      .no-native-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
