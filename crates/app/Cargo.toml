[package]
name = "claude-code-manager-app"
version = "0.1.1"
edition = "2021"
description = "Tauri desktop app for browsing, editing, and resuming Claude Code sessions."
license = "MIT"
repository = "https://github.com/zillydev/claude-code-manager"

[lib]
name = "claude_code_manager_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-code-manager-app"
path = "src/main.rs"

[dependencies]
claude-code-manager-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
portable-pty = "0.8"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# dev-only Dock name (see src/dock_name.rs); already in the tree via tauri
core-foundation = "0.10"
# window ids for the published status file (see src/win_id.rs)
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
