[package]
name = "claude-code-manager-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for browsing Claude Code sessions, plus the `surgery` CLI."
license = "MIT"
repository = "https://github.com/zillydev/claude-code-manager"

[[bin]]
name = "claude-code-manager"
path = "src/main.rs"

[dependencies]
claude-code-manager-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
dirs = "5"
