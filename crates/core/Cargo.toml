[package]
name = "claude-code-manager-core"
version = "0.1.2"
edition = "2021"
description = "Shared core: parse, render, and safely rewrite Claude Code session .jsonl files."
license = "MIT"
repository = "https://github.com/zillydev/claude-code-manager"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
uuid = { version = "1", features = ["serde", "v4"] }
dirs = "5"
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
insta = "1"
